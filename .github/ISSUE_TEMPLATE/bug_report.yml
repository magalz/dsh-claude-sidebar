name: Bug report
description: Report a problem with the dsh-claude-sidebar plugin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: dsh-version
    attributes:
      label: dsh version
      description: The version of DeepSeek Harness you are running.
      placeholder: "e.g. 1.2.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Your operating system and version.
      placeholder: "e.g. Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version or commit
      description: Released version or commit hash of the plugin.
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: Affected feature
      description: Which part has the problem?
      options:
        - Icon rail
        - Jobs tab
        - Subagents tab
        - Environment tab
        - Run button
        - Git tab
        - Pane sizes
        - Open in Browser
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console or log output
      description: Paste any relevant console messages or logs. Remove secrets first.
      render: shell
    validations:
      required: false
